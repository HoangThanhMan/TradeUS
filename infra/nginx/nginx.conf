events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ws_gateway {
        ip_hash;
        server ws-gateway-1:3002 weight=1 max_fails=3 fail_timeout=30s;
        server ws-gateway-2:3003 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream api_gateway {
        server api-gateway:3001 weight=1;
        keepalive 16;
    }

    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    server {
        listen 80;
        server_name localhost;
        
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # API REST
        location /api {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Socket.IO
        location /socket.io/ {
            limit_req zone=ws_limit burst=20 nodelay;
            limit_conn ws_conn 50;
            
            proxy_pass http://ws_gateway;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            proxy_buffering off;
        }
    }
}