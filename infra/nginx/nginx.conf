events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream ws_gateway {
        ip_hash;
        # Compose service names, not host.docker.internal: that hostname only
        # exists on Docker Desktop and does not resolve on a Linux server.
        server ws-gateway-1:3002 weight=1 max_fails=3 fail_timeout=30s;
        server ws-gateway-2:3003 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # api-gateway and web are resolved per request, not at startup.
    #
    # nginx resolves an `upstream` block's hostnames while parsing the config and
    # refuses to start if one is missing. That made the whole load balancer
    # unstartable whenever a single backend was down - and in
    # docker-compose.dev.yml there is no `web` service at all, since the frontend
    # runs via `npm run dev` on the host. Going through Docker's embedded DNS
    # (127.0.0.11) with the address in a variable defers the lookup to request
    # time, so a missing backend is a 502 on its own routes instead of an outage
    # for every route.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ws_conn:10m;

    server {
        listen 80;
        # `_` accepts any Host header: Caddy forwards the real domain, and this is
        # the only server block anyway.
        server_name _;
        
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;

        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Next.js CÓ route server-side riêng tại /api/chatbot
        # (apps/web/app/api/chatbot/route.ts), được ChatbotPanel.tsx gọi bằng URL
        # tương đối `fetch('/api/chatbot')`. Nó phải về `web`, không phải
        # api-gateway — api-gateway không có route này và sẽ trả 404.
        #
        # Prefix dài hơn nên luật này thắng `location /api` bên dưới.
        location /api/chatbot {
            set $web_app_addr "web:3000";
            proxy_pass http://$web_app_addr$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Chatbot gọi LLM + tool, chậm hơn REST thường nhiều.
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # API REST
        location /api {
            set $api_gateway_addr "api-gateway:3001";
            proxy_pass http://$api_gateway_addr$request_uri;
            proxy_http_version 1.1;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Socket.IO
        location /socket.io/ {
            limit_req zone=ws_limit burst=20 nodelay;
            limit_conn ws_conn 50;
            
            proxy_pass http://ws_gateway;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            
            proxy_connect_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            
            proxy_buffering off;
        }

        # Frontend Next.js — everything not matched above.
        #
        # Order in this file does not matter: nginx picks the LONGEST matching
        # prefix, so /api and /socket.io/ still win over /. (Caddy does not work
        # this way — see docs/deployment.md B8.)
        location / {
            set $web_app_addr "web:3000";
            proxy_pass http://$web_app_addr$request_uri;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}