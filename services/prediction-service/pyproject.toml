[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prediction-service"
version = "0.1.0"
description = "Trade-X Prediction Service - LSTM-based cryptocurrency price prediction"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "motor>=3.3.0",
    "aio-pika>=9.3.0",
    "torch>=2.1.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "black>=24.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Matches the ruleset sentiment-service already uses, so the two Python
# services are linted the same way.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# UP017 rewrites `timezone.utc` to `datetime.UTC`, which is 3.11+. The Docker
# images are 3.11, but the eval/ingestion scripts here are also run directly on
# developer machines, so keep the 3.10-compatible spelling.
ignore = ["UP017"]

[tool.black]
line-length = 100
target-version = ["py311"]
