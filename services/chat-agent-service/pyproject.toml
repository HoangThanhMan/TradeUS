[project]
name = "chat-agent-service"
version = "0.1.0"
description = "RAG + tool-calling market agent for TradeX"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
# UP017 rewrites `timezone.utc` to `datetime.UTC`, which is 3.11+. The Docker
# images are 3.11, but the eval/ingestion scripts here are also run directly on
# developer machines, so keep the 3.10-compatible spelling.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
