version: '3.8'

# =============================================================================
# 1. Shared Configuration (YAML Anchors) - Giúp file gọn gàng hơn
# =============================================================================
x-common-env: &common-env
  NODE_ENV: development
  LOG_LEVEL: info
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
  REDIS_URL: redis://redis:6379
  # Biến này dùng chung cho các Node.js service
  MONGODB_URI: mongodb://admin:password@mongodb:27017/tradex?authSource=admin

services:
  # =============================================================================
  # Infrastructure Services
  # =============================================================================

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: tradex-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - tradex-network

  mongodb:
    image: mongo:7.0
    container_name: tradex-mongodb
    ports:
      - "27017:27017" # Giữ lại để bạn debug bằng Compass/Studio3T
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: tradex
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tradex-network

  redis:
    image: redis:7-alpine
    container_name: tradex-redis
    ports:
      - "6379:6379" # Giữ lại để debug
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradex-network

  # =============================================================================
  # Data Collection Services
  # =============================================================================

  collector-price:
    build:
      context: .
      dockerfile: ./services/collector-price/Dockerfile
    container_name: tradex-collector-price
    restart: unless-stopped
    environment:
      <<: *common-env # Kế thừa biến chung
      BINANCE_WS_URL: wss://fstream.binance.com/stream
      BINANCE_SYMBOLS: btcusdt,ethusdt,bnbusdt,solusdt,xrpusdt
      BINANCE_STREAM_TYPE: miniTicker
      RABBITMQ_EXCHANGE: tradex.prices
      RABBITMQ_EXCHANGE_TYPE: topic
      RABBITMQ_ROUTING_KEY_PREFIX: price
    depends_on:
      rabbitmq:
        condition: service_healthy # Chỉ chạy khi RabbitMQ đã xanh
    networks:
      - tradex-network

  # =============================================================================
  # AI/ML Services (Python)
  # =============================================================================

  sentiment-service:
    build:
      context: ./services/sentiment-service
      dockerfile: Dockerfile
    container_name: tradex-sentiment-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      ENVIRONMENT: development
      PORT: 8001
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://admin:password@mongodb:27017/tradex_sentiment?authSource=admin
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      retries: 3
    networks:
      - tradex-network

  prediction-service:
    build:
      context: ./services/prediction-service
      dockerfile: Dockerfile
    container_name: tradex-prediction-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      ENVIRONMENT: development
      PORT: 8002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      MONGODB_URL: mongodb://admin:password@mongodb:27017/tradex_predictions?authSource=admin
      SENTIMENT_SERVICE_URL: http://sentiment-service:8001
      MODEL_PATH: models/crypto_predictor_btcusdt.pt
    volumes:
      - ./services/prediction-service/models:/app/models:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      sentiment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8002/health').raise_for_status()"]
      interval: 30s
      retries: 3
    networks:
      - tradex-network

  # =============================================================================
  # Backend Services
  # =============================================================================

  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
    container_name: tradex-api-gateway
    ports:
      - "3001:3001" # Cổng chính cho Client (Frontend)
    environment:
      <<: *common-env
      PORT: 3001
      USER_SERVICE_URL: http://user-service:3010
      SENTIMENT_SERVICE_URL: http://sentiment-service:8001
      PREDICTION_SERVICE_URL: http://prediction-service:8002
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # API Gateway nên đợi User Service sẵn sàng (nếu User Service có healthcheck)
      user-service:
        condition: service_started 
    networks:
      - tradex-network

  user-service:
    build:
      context: .
      dockerfile: ./services/user-service/Dockerfile
    container_name: tradex-user-service
    ports:
      - "3010:3010"
    environment:
      <<: *common-env
      PORT: 3010
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tradex-network

  # =============================================================================
  # WebSocket Cluster
  # =============================================================================
  
  ws-gateway-1:
    build:
      context: .
      dockerfile: ./apps/ws-gateway/Dockerfile
    container_name: tradex-ws-gateway-1
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      <<: *common-env
      PORT: 3002
      INSTANCE_ID: ws-gateway-1
      RABBITMQ_EXCHANGE: tradex.prices
      RABBITMQ_EXCHANGE_TYPE: topic
      RABBITMQ_QUEUE_PREFIX: ws-gateway
      RABBITMQ_ROUTING_PATTERNS: price.#
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - tradex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      retries: 3

  ws-gateway-2:
    build:
      context: .
      dockerfile: ./apps/ws-gateway/Dockerfile
    container_name: tradex-ws-gateway-2
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      <<: *common-env
      PORT: 3003 # Lưu ý: Trong container vẫn chạy port 3003
      INSTANCE_ID: ws-gateway-2
      RABBITMQ_EXCHANGE: tradex.prices
      RABBITMQ_EXCHANGE_TYPE: topic
      RABBITMQ_QUEUE_PREFIX: ws-gateway
      RABBITMQ_ROUTING_PATTERNS: price.#
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - tradex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      retries: 3

  # =============================================================================
  # Load Balancer
  # =============================================================================
  
  nginx:
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile
    container_name: tradex-nginx
    restart: unless-stopped
    ports:
      - "80:80" # Cổng chính cho WebSocket Client
    depends_on:
      ws-gateway-1:
        condition: service_healthy
      ws-gateway-2:
        condition: service_healthy
    networks:
      - tradex-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      retries: 3

networks:
  tradex-network:
    driver: bridge

volumes:
  rabbitmq_data:
  mongodb_data:
  redis_data:
